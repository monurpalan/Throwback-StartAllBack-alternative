name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch }}

      - name: Build
        run: cmake --build build --config Release

      # ARM64 binaries can't run on the x64 runner, so only x64 runs tests.
      - name: Test
        if: matrix.arch == 'x64'
        run: ctest --test-dir build -C Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: throwback-${{ matrix.arch }}
          path: build/Release/throwback.exe

  checks:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # File and function size limits (clang-tidy ships with the runner's LLVM).
      - name: Code limits
        shell: pwsh
        run: ./tools/check-code.ps1

      - name: Formatting
        shell: pwsh
        run: |
          $files = Get-ChildItem src, tests -Recurse -Include *.cpp, *.h
          clang-format --dry-run --Werror $files.FullName
