name: Release

# A tag like v0.1.0 builds both architectures from that commit and publishes
# them, with their SHA-256 sums, as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - arch: x64
            file: throwback.exe
          - arch: ARM64
            file: throwback-arm64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch }} -DTHROWBACK_BUILD_TESTS=OFF
          cmake --build build --config Release

      - name: Name the file
        shell: pwsh
        run: Copy-Item build/Release/throwback.exe ${{ matrix.file }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum throwback.exe throwback-arm64.exe > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" throwback.exe throwback-arm64.exe SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --title "Throwback ${GITHUB_REF_NAME#v}" --generate-notes
